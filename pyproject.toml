[project]
name = "bootcamps-api"
version = "1.0.0"
requires-python = ">=3.12"

[tool.ruff]
line-length = 160
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "BLE"]
ignore = ["S101", "B008", "E501", "S311", "S105", "S106", "B904", "UP017"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B"]
"app/seed.py" = ["S"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["app"]
omit = ["app/seed.py"]
